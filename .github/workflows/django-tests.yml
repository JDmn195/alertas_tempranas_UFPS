name: Django Tests

on:
  push:
    branches: ["main", "fix/**", "feat/**", "hotfix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BACKEND/alertas_tempranas_ufps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: BACKEND/alertas_tempranas_ufps/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: "ci-secret-key-not-used-in-production"
          DEBUG: "True"
          # La BD de tests usa SQLite (ver settings.py: 'test' in sys.argv)
          # No se necesita DATABASE_URL en CI
        run: python manage.py test --verbosity=2
